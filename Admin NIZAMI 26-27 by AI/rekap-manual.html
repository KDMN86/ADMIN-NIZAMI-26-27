<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Rekap Manual (Fix Barang)</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      :root {
        --primary: #ffd700;
        --bg: #121212;
        --surface: #1e1e1e;
        --text: #e0e0e0;
        --border: #333;
        --danger: #ff4d4d;
        --success: #4ade80;
      }
      * { box-sizing: border-box; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", sans-serif;
        margin: 0;
        padding: 0;
        padding-bottom: 100px;
      }

      /* NAVIGASI */
      .top-nav {
        background: rgba(18, 18, 18, 0.95);
        backdrop-filter: blur(10px);
        padding: 15px 20px;
        position: sticky;
        top: 0;
        z-index: 50;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .nav-left { display: flex; align-items: center; gap: 15px; }
      .back-btn {
        background: #2a2a2a; color: white; width: 38px; height: 38px;
        border-radius: 50%; display: flex; align-items: center;
        justify-content: center; text-decoration: none;
      }

      /* PENCARIAN & FILTER */
      .search-box {
        padding: 15px 20px; background: #181818;
        border-bottom: 1px dashed #333;
      }
      .search-input-wrap {
        position: relative; display: flex; align-items: center; margin-bottom: 10px;
      }
      .search-input-wrap i { position: absolute; left: 15px; color: #888; }
      .search-input {
        width: 100%; padding: 12px 12px 12px 40px; background: #222;
        border: 1px solid #444; color: white; border-radius: 10px;
        outline: none; font-size: 0.9rem; font-weight: bold;
      }
      .search-input:focus { border-color: var(--primary); }

      /* FILTER EXTENDED */
      .filter-group {
        display: flex; flex-direction: column; gap: 10px; margin-bottom: 5px;
      }
      .filter-select-normal, .filter-input-normal {
        background: #1a1a1a; color: var(--primary); border: 1px dashed #444;
        padding: 10px; border-radius: 8px; font-size: 0.85rem; outline: none;
        font-weight: bold; width: 100%;
      }
      .filter-select-normal {
        appearance: none; cursor: pointer;
        background-image: url('data:image/svg+xml;utf8,<svg fill="%23ffd700" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
        background-repeat: no-repeat; background-position: right 10px center;
      }
      .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

      /* DROPDOWN MULTI-SELECT CHECKBOX */
      .cs-wrap { position: relative; width: 100%; }
      .cs-header {
        background: #1a1a1a; border: 1px dashed #444; padding: 10px;
        border-radius: 8px; font-size: 0.8rem; color: #fff; font-weight: bold;
        cursor: pointer; display: flex; justify-content: space-between;
        align-items: center; user-select: none;
      }
      .cs-header.has-val { color: var(--primary); border-color: var(--primary); }
      .cs-list {
        display: none; position: absolute; top: 105%; left: 0; width: 100%;
        background: #111; border: 1px solid #444; border-radius: 8px;
        z-index: 60; max-height: 200px; overflow-y: auto;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8); padding: 10px;
        flex-direction: column; gap: 8px;
      }
      .cs-list.show { display: flex; }
      .cs-list label {
        font-size: 0.85rem; color: #ddd; display: flex; align-items: center;
        gap: 8px; cursor: pointer;
      }

      /* HASIL LIST PESERTA & ACCORDION */
      #listPeserta {
        max-height: calc(100vh - 280px); overflow-y: auto; background: #121212;
        border-radius: 10px; margin-top: 10px;
      }
      .peserta-item-wrapper {
        border: 1px solid #333; margin-bottom: 12px; border-radius: 8px;
        background: #1e1e1e; overflow: hidden;
      }
      .peserta-item-wrapper:last-child { border-bottom: none; }
      .peserta-header {
        padding: 12px 15px; cursor: pointer; display: flex;
        justify-content: space-between; align-items: center;
        background: linear-gradient(145deg, #2a2a2a, #1f1f1f);
        border-left: 4px solid var(--primary); transition: 0.2s;
      }
      .peserta-header:hover { background: linear-gradient(145deg, #333, #252525); }

      .badge-freq { background: rgba(74, 222, 128, 0.1); color: #4ade80; padding: 3px 6px; border-radius: 4px; font-size: 0.7rem; border: 1px solid rgba(74, 222, 128, 0.3); }
      .badge-mitra { background: #222; color: var(--primary); padding: 3px 6px; border-radius: 4px; font-size: 0.7rem; border: 1px solid #444; }
      .badge-status-pilih { font-size: 0.7rem; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
      .badge-belum { background: rgba(255, 215, 0, 0.1); color: var(--primary); border: 1px solid rgba(255, 215, 0, 0.3); }
      .badge-sudah { background: rgba(74, 222, 128, 0.1); color: var(--success); border: 1px solid rgba(74, 222, 128, 0.3); }

      /* AREA DROPDOWN RINCIAN PESANAN */
      .pesanan-container { display: none; padding: 12px 15px; background: #0f0f0f; border-top: 1px dashed #444; }
      .saldo-badge { background: rgba(74, 222, 128, 0.15); color: var(--success); padding: 4px 8px; border-radius: 6px; font-weight: bold; font-size: 0.75rem; border: 1px solid rgba(74, 222, 128, 0.4); }
      .summary-box { background: #111; padding: 12px 15px; border-radius: 8px; border: 1px solid #444; margin-bottom: 12px; box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5); }
      .sum-row { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 0.8rem; color: #ccc; }
      .sum-row b { font-size: 0.85rem; }
      .sum-row.sisa { border-top: 1px dashed #555; padding-top: 6px; margin-top: 6px; color: #fff; font-size: 0.85rem; }
      .sum-row.sisa b { font-size: 1rem; }

      .btn-wa, .btn-select-all, .btn-edit-mode {
        width: 100%; border-radius: 8px; font-weight: bold; font-size: 0.8rem; cursor: pointer;
        display: flex; gap: 6px; align-items: center; justify-content: center; margin-bottom: 8px;
      }
      .btn-wa { background: #25d366; color: #000; border: none; padding: 8px; }
      .btn-select-all { background: #2a2a2a; color: var(--primary); border: 1px solid #444; padding: 6px 10px; font-size: 0.75rem; }
      .btn-edit-mode { background: rgba(255, 215, 0, 0.15); color: var(--primary); border: 1px dashed var(--primary); padding: 6px 10px; font-size: 0.75rem; }

      .barang-card { background: #111; border: 1px solid #333; border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; transition: 0.2s; }
      .barang-card.checked { border-color: var(--success); background: rgba(74, 222, 128, 0.05); }
      .input-qty-custom { width: 55px; background: #000; border: 1px solid var(--primary); color: #fff; padding: 6px; border-radius: 6px; text-align: center; font-weight: bold; font-size: 0.85rem; outline: none; }
      .input-qty-custom:focus { border-color: var(--success); }
      .custom-checkbox { width: 24px; height: 24px; border: 2px solid #555; border-radius: 5px; display: flex; align-items: center; justify-content: center; transition: 0.2s; cursor: pointer; flex-shrink: 0; }
      .custom-checkbox i { color: transparent; font-size: 0.75rem; }
      .barang-card.checked .custom-checkbox { background: var(--success); border-color: var(--success); }
      .barang-card.checked .custom-checkbox i { color: #000; }

      /* DAFTAR BELANJA & TABS */
      .belanja-card-item { background: #151515; border: 1px solid #333; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; transition: 0.2s; }
      .belanja-card-item.aman { border-left: 4px solid var(--success); }
      .belanja-card-item.kurang { border-left: 4px solid var(--danger); }
      .modal-tabs { display: flex; background: #111; border-bottom: 1px solid #333; }
      .modal-tab-btn { flex: 1; padding: 12px; background: none; border: none; color: #888; font-weight: bold; font-size: 0.85rem; cursor: pointer; text-align: center; border-bottom: 2px solid transparent; }
      .modal-tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); background: #181818; }

      /* BOTTOM BAR */
      .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(20, 20, 20, 0.95); backdrop-filter: blur(10px); padding: 15px 20px; border-top: 1px solid #333; z-index: 100; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .btn-save { background: var(--primary); color: #000; border: none; padding: 12px 15px; flex: 1.2; border-radius: 10px; font-weight: bold; font-size: 0.85rem; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 215, 0, 0.2); display: flex; gap: 8px; align-items: center; justify-content: center; }
      .btn-belanja { background: #2a2a2a; color: var(--primary); border: 1px solid var(--primary); padding: 12px 15px; flex: 1; border-radius: 10px; font-weight: bold; font-size: 0.85rem; cursor: pointer; display: flex; gap: 8px; align-items: center; justify-content: center; }
      .floating-add-btn { position: absolute; bottom: 20px; right: 20px; background: var(--primary); color: #000; width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4); cursor: pointer; z-index: 90; border: none; transition: 0.2s; }
      .floating-add-btn:active { transform: scale(0.92); }
      #loading { text-align: center; padding: 40px; color: #888; display: none; }
      @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
  </head>
  <body>
    <div class="top-nav">
      <div class="nav-left">
        <a href="index.html" class="back-btn" onclick="return confirmExit();"><i class="fas fa-arrow-left"></i></a>
        <h2 style="margin: 0; font-size: 1.1rem">Rekap Manual (Fix)</h2>
      </div>
    </div>

    <!-- AREA PENCARIAN & FILTER -->
    <div class="search-box" id="areaPencarian">
      <div class="search-input-wrap">
        <i class="fas fa-search"></i>
        <input type="text" id="inputCari" class="search-input" placeholder="Cari nama atau ID peserta..." oninput="terapkanFilter()" />
      </div>

      <!-- FILTER TAMBAHAN KHUSUS ORDERAN BARANG (MENCARI PESERTA) -->
      <div class="search-input-wrap">
        <i class="fas fa-box"></i>
        <input type="text" id="filterOrderanBarang" class="search-input" list="datalist-barang" placeholder="Filter khusus peserta yang order barang..." oninput="terapkanFilter()" />
      </div>

      <div class="filter-group">
        <div style="display: flex; gap: 10px">
          <select id="filterOperator" class="filter-select-normal" style="flex: 1" onchange="toggleFilterInput(); terapkanFilter();">
            <option value="ALL">🎯 Semua Setoran</option>
            <option value="<">Kurang dari (<)</option>
            <option value=">">Lebih dari (>)</option>
            <option value="=">Sama dengan (=)</option>
          </select>
          <input type="number" id="filterAngka" class="filter-input-normal" style="flex: 1; display: none" placeholder="Ketik freq..." oninput="terapkanFilter()" />
        </div>
        <div class="grid-2">
          <div class="cs-wrap" id="wrapMitra">
            <div class="cs-header" id="headMitra" onclick="toggleDrop('listMitra')">Mitra: Semua <i class="fas fa-caret-down"></i></div>
            <div class="cs-list" id="listMitra"></div>
          </div>
          <div class="cs-wrap" id="wrapPaket">
            <div class="cs-header" id="headPaket" onclick="toggleDrop('listPaket')">Paket: Semua <i class="fas fa-caret-down"></i></div>
            <div class="cs-list" id="listPaket"></div>
          </div>
        </div>
      </div>

      <div id="infoTotalFilter" style="font-size: 0.75rem; color: #aaa; margin-top: 10px; text-align: right;"></div>

      <!-- KOTAK AKSI CHECKLIST MASSAL (MUNCUL OTOMATIS SAAT FILTER BARANG) -->
      <div id="bulkCheckArea" style="margin-top: 15px; display: none; padding: 12px; background: rgba(74,222,128,0.1); border-radius: 8px; border: 1px dashed var(--success);">
        <div style="font-size: 0.8rem; color: var(--success); font-weight: bold; margin-bottom: 8px;">
          <i class="fas fa-check-double"></i> Aksi Massal: Checklist Otomatis
        </div>
        <div style="font-size: 0.75rem; color: #ccc; margin-bottom: 10px;">
          Centang otomatis barang <b id="lblBarangMassal" style="color:#fff;"></b> untuk semua <b id="lblJmlPesertaMassal">0</b> peserta di bawah ini.
        </div>
        <button onclick="terapkanChecklistMassal(event)" style="width: 100%; background: var(--success); color: #000; border: none; border-radius: 6px; font-weight: bold; padding: 10px; cursor: pointer;">
          JALANKAN CHECKLIST MASSAL (AUTO-SAVE)
        </button>
      </div>

      <div id="listPeserta">
        <div style="padding: 30px 20px; text-align: center; color: #555; border: 1px dashed #333; border-radius: 12px; margin: 20px;">
          Gunakan filter dan cari peserta di atas.
        </div>
      </div>
    </div>

    <div id="loading">
      <i class="fas fa-spinner fa-spin fa-2x" style="color: var(--primary)"></i><br /><br />Memuat data...
    </div>

    <!-- BOTTOM ACTION BAR -->
    <div class="bottom-bar">
      <div style="display: none; flex-direction: column; justify-content: center" id="infoTotalBottom">
        <span style="display: block; font-size: 0.65rem; color: #888; text-transform: uppercase;">Total Dibeli</span>
        <b id="lblTotalHarga" style="font-size: 1rem; color: var(--success)">Rp 0</b>
      </div>
      <button class="btn-belanja" onclick="bukaModalBelanja()">
        <i class="fas fa-shopping-cart"></i> DAFTAR BELANJA
      </button>
      <button class="btn-save" id="btnSimpan" onclick="simpanChecklistGlobal()" style="display: none">
        <i class="fas fa-save"></i> SIMPAN CHECKLIST
      </button>
    </div>

    <!-- MODAL DAFTAR BELANJA & RIWAYAT GUDANG -->
    <div id="modalBelanja" style="display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9); z-index: 9999; flex-direction: column; justify-content: flex-end;">
      <div style="background: #1e1e1e; height: 90vh; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; animation: slideUp 0.3s; border-top: 1px solid #444;">
        <div style="padding: 15px 20px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center;">
          <div>
            <h3 style="margin: 0 0 3px 0; color: var(--primary); font-size: 1.05rem;"><i class="fas fa-shopping-cart"></i> Manajemen Belanja & Gudang</h3>
            <div style="font-size: 0.7rem; color: #888">Sinkronisasi FIX_BARANG & REKAP_BELANJA</div>
          </div>
          <i class="fas fa-times" style="font-size: 1.4rem; color: #888; cursor: pointer" onclick="document.getElementById('modalBelanja').style.display = 'none'"></i>
        </div>

        <div class="modal-tabs">
          <button class="modal-tab-btn active" id="tabBtnBelanja" onclick="switchModalTab('belanja')"><i class="fas fa-list-check"></i> Daftar Belanja (Kurang)</button>
          <button class="modal-tab-btn" id="tabBtnSudahBeli" onclick="switchModalTab('sudahBeli')"><i class="fas fa-warehouse"></i> Riwayat Di Gudang</button>
        </div>

        <div id="contentTabBelanja" style="display: flex; flex-direction: column; flex: 1; overflow: hidden;">
          <div style="padding: 10px 15px; background: #151515; border-bottom: 1px dashed #333; display: flex; flex-direction: column; gap: 8px;">
            <div style="position: relative; display: flex; align-items: center">
              <i class="fas fa-search" style="position: absolute; left: 12px; color: #888; font-size: 0.8rem;"></i>
              <input type="text" id="cariBarangBelanja" class="search-input" style="padding-top: 7px; padding-bottom: 7px; font-size: 0.85rem;" placeholder="Cari nama barang..." oninput="renderBelanjaList()" />
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px;">
              <select id="filterKategoriBarang" class="filter-select-normal" style="flex: 1; padding: 7px; font-size: 0.8rem" onchange="renderBelanjaList()"><option value="ALL">📂 Semua Kategori</option></select>
              <label style="color: #fff; font-size: 0.75rem; display: flex; align-items: center; gap: 6px; white-space: nowrap; cursor: pointer;">
                <input type="checkbox" id="chkHanyaKurang" onchange="renderBelanjaList()" checked style="width: 16px; height: 16px; accent-color: var(--primary);" /> Hanya kurang
              </label>
            </div>
          </div>
          <div style="padding: 12px; overflow-y: auto; flex: 1" id="listBelanjaContainer"></div>
          <div style="padding: 12px 20px; background: #111; border-top: 1px solid #333;">
            <button onclick="simpanStokBelanja()" id="btnSimpanBelanja" style="width: 100%; padding: 12px; background: var(--primary); color: #000; border: none; border-radius: 10px; font-weight: bold; font-size: 0.85rem;">
              <i class="fas fa-save"></i> SIMPAN BARANG MASUK KE GUDANG
            </button>
          </div>
        </div>

        <div id="contentTabSudahBeli" style="display: none; flex-direction: column; flex: 1; overflow: hidden; position: relative;">
          <div style="padding: 10px 15px; background: #151515; border-bottom: 1px dashed #333; display: flex; gap: 10px;">
            <div style="position: relative; display: flex; align-items: center; flex: 1;">
              <i class="fas fa-search" style="position: absolute; left: 12px; color: #888; font-size: 0.8rem;"></i>
              <input type="text" id="cariRiwayatGudang" class="search-input" style="padding-top: 7px; padding-bottom: 7px; font-size: 0.85rem;" placeholder="Cari barang di gudang..." oninput="renderRiwayatGudangList()" />
            </div>
            <select id="filterKategoriRiwayat" class="filter-select-normal" style="width: 140px; padding: 7px; font-size: 0.8rem" onchange="renderRiwayatGudangList()"><option value="ALL">📂 Semua</option></select>
          </div>
          <div style="padding: 12px; overflow-y: auto; flex: 1" id="listRiwayatGudangContainer"></div>
          <button class="floating-add-btn" onclick="bukaModalFormTambahBelanja()" title="Tambah Belanjaan"><i class="fas fa-plus"></i></button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
    <script>
      let dataPesertaManual = [];
      let currentFilteredPeserta = [];
      let allDataBarang = {};
      let saldoPeserta = {};
      let dataBelanjaGlobal = [];
      let masterBarangGlobal = {};
      let setSudahFixServer = new Set();
      let mapOrderanPeserta = {}; // Menyimpan data "ID -> Kumpulan Barang yang Dipesan"

      function formatUang(angka) {
        return new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", minimumFractionDigits: 0 }).format(angka || 0);
      }

      async function initData() {
        document.getElementById("loading").style.display = "block";
        document.getElementById("listPeserta").style.display = "none";
        try {
          // Tarik semua resource secara bersamaan agar optimal
          const [resStats, resMaster, resFixList, resRekap] = await Promise.all([
            fetchData("getAdminStats"),
            fetchData("getBarang"),
            fetchData("getListSudahFix"),
            fetchData("getRekapBelanja") 
          ]);

          let rawBarang = resMaster;
          if (resMaster && resMaster.data) rawBarang = resMaster.data;
          if (Array.isArray(rawBarang)) {
            rawBarang.forEach((b) => {
              if (b.nama) {
                masterBarangGlobal[b.nama.trim().toLowerCase()] = {
                  namaAsli: b.nama.trim(),
                  kategori: b.kategori || "Lainnya",
                  satuan: b.satuan || "pcs",
                  hargaBeli: Number(b.hargaBeli || b.harga_beli) || 0,
                  hargaJual: Number(b.hargaJual || b.harga_jual || b.harga) || 0,
                };
              }
            });
          }

          if (resFixList && resFixList.success && Array.isArray(resFixList.list)) {
            resFixList.list.forEach((id) => setSudahFixServer.add(id));
          }

          if (resStats && resStats.paketBreakdown) {
            let tempAll = [];
            let mitraSet = new Set();
            let paketSet = new Set();

            for (let pkt in resStats.paketBreakdown) {
              paketSet.add(pkt);
              resStats.paketBreakdown[pkt].forEach((p) => {
                let m = (p.mitra || "Pusat").trim();
                mitraSet.add(m);
                tempAll.push({
                  id: String(p.id || ""),
                  nama: String(p.nama || ""),
                  mitra: m,
                  paket: pkt,
                  freq: Number(p.freq) || 0,
                  nilai_setoran: Number(p.nilai_setoran) || 0,
                });
              });
            }
            dataPesertaManual = tempAll;
            renderFilterDropdown("listMitra", mitraSet, "chk-mitra");
            renderFilterDropdown("listPaket", paketSet, "chk-paket");
          }

          // MEMBANGUN PETA BARANG PER PESERTA (Untuk Filter Spesifik Barang)
          if (resRekap && resRekap.peserta) {
              let resepMap = {};
              (resRekap.resep || []).forEach(r => {
                  let pkt = String(r.paket).trim().toLowerCase();
                  if (!resepMap[pkt]) resepMap[pkt] = new Set();
                  resepMap[pkt].add(String(r.barang).trim().toLowerCase());
              });

              (resRekap.custom || []).forEach(c => {
                  let pid = String(c.id_peserta).trim();
                  if (!mapOrderanPeserta[pid]) mapOrderanPeserta[pid] = new Set();
                  mapOrderanPeserta[pid].add(String(c.barang).trim().toLowerCase());
              });

              dataPesertaManual.forEach(p => {
                  let pid = String(p.id).trim();
                  let pkt = String(p.paket).trim().toLowerCase();
                  if (!mapOrderanPeserta[pid]) mapOrderanPeserta[pid] = new Set();
                  if (resepMap[pkt]) {
                      resepMap[pkt].forEach(b => mapOrderanPeserta[pid].add(b));
                  }
              });
          }
        } catch (e) {
          console.error("Gagal muat data", e);
        } finally {
          document.getElementById("loading").style.display = "none";
          document.getElementById("listPeserta").style.display = "block";

          let datalist = document.createElement("datalist");
          datalist.id = "datalist-barang";
          let options = "";
          Object.values(masterBarangGlobal).forEach(info => { options += `<option value="${info.namaAsli}">`; });
          datalist.innerHTML = options;
          document.body.appendChild(datalist);
        }
      }

      function renderFilterDropdown(containerId, dataSet, className) {
        const box = document.getElementById(containerId);
        box.innerHTML = "";
        Array.from(dataSet).sort().forEach((item) => {
            box.innerHTML += `<label><input type="checkbox" class="${className}" value="${item}" onchange="terapkanFilter()"> ${item}</label>`;
        });
      }

      function toggleDrop(idList) {
        const allLists = document.querySelectorAll(".cs-list");
        allLists.forEach((l) => { if (l.id !== idList) l.classList.remove("show"); });
        document.getElementById(idList).classList.toggle("show");
      }
      document.addEventListener("click", function (e) {
        if (!e.target.closest(".cs-wrap")) document.querySelectorAll(".cs-list").forEach((l) => l.classList.remove("show"));
      });
      function toggleFilterInput() {
        const op = document.getElementById("filterOperator").value;
        const inp = document.getElementById("filterAngka");
        if (op === "ALL") { inp.style.display = "none"; inp.value = ""; } 
        else { inp.style.display = "block"; inp.focus(); }
      }

      function terapkanFilter() {
        const keyword = document.getElementById("inputCari").value.toLowerCase();
        const filterBrgText = document.getElementById("filterOrderanBarang").value.trim().toLowerCase();
        const operator = document.getElementById("filterOperator").value;
        const inputAngka = document.getElementById("filterAngka").value;
        const numAngka = parseInt(inputAngka);

        const arrMitra = Array.from(document.querySelectorAll(".chk-mitra:checked")).map((el) => el.value);
        const arrPaket = Array.from(document.querySelectorAll(".chk-paket:checked")).map((el) => el.value);

        const headMitra = document.getElementById("headMitra");
        if (arrMitra.length > 0) { headMitra.innerHTML = `Mitra (${arrMitra.length}) <i class="fas fa-caret-down"></i>`; headMitra.classList.add("has-val"); } 
        else { headMitra.innerHTML = `Mitra: Semua <i class="fas fa-caret-down"></i>`; headMitra.classList.remove("has-val"); }

        const headPaket = document.getElementById("headPaket");
        if (arrPaket.length > 0) { headPaket.innerHTML = `Paket (${arrPaket.length}) <i class="fas fa-caret-down"></i>`; headPaket.classList.add("has-val"); } 
        else { headPaket.innerHTML = `Paket: Semua <i class="fas fa-caret-down"></i>`; headPaket.classList.remove("has-val"); }

        const boxList = document.getElementById("listPeserta");
        boxList.innerHTML = "";

        if (keyword === "" && filterBrgText === "" && operator === "ALL" && arrMitra.length === 0 && arrPaket.length === 0) {
          boxList.innerHTML = `<div style="padding:30px 20px; text-align:center; color:#555; border:1px dashed #333; border-radius:12px; margin:20px;">Gunakan filter dan cari peserta di atas.</div>`;
          document.getElementById("infoTotalFilter").innerText = "";
          currentFilteredPeserta = [];
          document.getElementById("bulkCheckArea").style.display = "none";
          return;
        }

        let hasil = dataPesertaManual.filter((p) => {
          let matchKey = keyword === "" || String(p.nama).toLowerCase().includes(keyword) || String(p.id).toLowerCase().includes(keyword);
          let matchMitra = arrMitra.length === 0 || arrMitra.includes(p.mitra);
          let matchPaket = arrPaket.length === 0 || arrPaket.includes(p.paket);
          let matchFreq = true;
          
          if (operator !== "ALL" && inputAngka !== "") {
            if (operator === ">") matchFreq = p.freq > numAngka;
            else if (operator === "<") matchFreq = p.freq < numAngka;
            else if (operator === "=") matchFreq = p.freq === numAngka;
          }

          let matchBrg = true;
          if (filterBrgText !== "") {
              let items = mapOrderanPeserta[p.id];
              if (!items) { matchBrg = false; } 
              else { matchBrg = Array.from(items).some(brg => brg.includes(filterBrgText)); }
          }
          return matchKey && matchMitra && matchPaket && matchFreq && matchBrg;
        });

        currentFilteredPeserta = hasil;
        document.getElementById("infoTotalFilter").innerText = `Menampilkan ${hasil.length} Peserta`;

        // Memunculkan/Menyembunyikan Kotak Checklist Massal
        const bulkArea = document.getElementById("bulkCheckArea");
        if (filterBrgText !== "" && hasil.length > 0) {
            bulkArea.style.display = "block";
            document.getElementById("lblBarangMassal").innerText = `"${filterBrgText}"`;
            document.getElementById("lblJmlPesertaMassal").innerText = hasil.length;
        } else {
            bulkArea.style.display = "none";
        }

        if (hasil.length > 0) {
          hasil.slice(0, 50).forEach((p) => {
            let namaEscaped = p.nama.replace(/'/g, "\\'");
            let paketEscaped = p.paket.replace(/'/g, "\\'");
            let isSudah = setSudahFixServer.has(p.id);
            let badgeStatusHtml = isSudah
              ? `<span class="badge-status-pilih badge-sudah" id="badge-status-wrap-${p.id}"><i class="fas fa-check-circle"></i> Sudah Dipilih</span>`
              : `<span class="badge-status-pilih badge-belum" id="badge-status-wrap-${p.id}"><i class="fas fa-clock"></i> Belum Dipilih</span>`;

            boxList.innerHTML += `
              <div class="peserta-item-wrapper">
                <div class="peserta-header" onclick="toggleDropdownPesanan('${p.id}', '${namaEscaped}', '${paketEscaped}')">
                  <div style="flex:1;">
                    <div style="color:#fff; font-weight:bold; font-size:0.95rem; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center;">
                      <span>${p.nama}</span>
                      ${badgeStatusHtml}
                    </div>
                    <div style="display:flex; gap:5px; flex-wrap:wrap; margin-bottom:6px;">
                      <span class="badge-freq"><i class="fas fa-coins"></i> ${p.freq}x Setor</span>
                      <span class="badge-mitra"><i class="fas fa-box"></i> ${p.paket}</span>
                      <span class="badge-mitra" style="background: rgba(255, 255, 255, 0.1); color: #ddd; border-color: #555;"><i class="fas fa-money-bill-wave"></i> Rp ${formatUang(p.nilai_setoran)}/Setor</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:flex-end;">
                      <span style="color:#666; font-size:0.75rem;">ID: ${p.id}</span>
                      <div style="text-align: right; display: flex; flex-direction: column; gap: 4px; align-items: flex-end;">
                        <span id="badge-saldo-${p.id}" class="saldo-badge" style="display:none;"></span>
                        <span id="badge-total-barang-${p.id}" style="display:none; font-size: 0.75rem; color: #ff4d4d; background: rgba(255, 77, 77, 0.1); border: 1px solid rgba(255, 77, 77, 0.3); padding: 3px 6px; border-radius: 4px; font-weight: bold;"></span>
                      </div>
                    </div>
                  </div>
                  <i id="icon-${p.id}" class="fas fa-chevron-right" style="color:#555; padding-left:15px; align-self: center;"></i>
                </div>
                
                <div id="dropdown-${p.id}" class="pesanan-container">
                  <div id="loading-${p.id}" style="text-align:center; padding:15px; color:var(--primary); display:none;">
                    <i class="fas fa-spinner fa-spin"></i> Memuat rincian...
                  </div>
                  <div id="summary-box-${p.id}"></div> 
                  <div id="list-barang-${p.id}"></div>
                </div>
              </div>
            `;
          });
        } else {
          boxList.innerHTML = `<div style="padding:20px; text-align:center; color:#ff4d4d; font-size:0.85rem;">Peserta tidak ditemukan dari kriteria tersebut.</div>`;
        }
      }

      async function toggleDropdownPesanan(id, pNama, pPaket) {
        const dropdown = document.getElementById(`dropdown-${id}`);
        const icon = document.getElementById(`icon-${id}`);

        if (dropdown.style.display === "block") {
          dropdown.style.display = "none";
          icon.classList.replace("fa-chevron-down", "fa-chevron-right");
        } else {
          dropdown.style.display = "block";
          icon.classList.replace("fa-chevron-right", "fa-chevron-down");

          if (!allDataBarang[id]) {
            document.getElementById(`loading-${id}`).style.display = "block";
            try {
              const [resDetail, resProfil] = await Promise.all([
                fetchData("getDetailPesananPeserta", { id_peserta: id }, "POST"),
                fetchData("getDetailAdmin", { id: id }),
              ]);

              if (resProfil && !resProfil.error) {
                let saldoInt = Number(resProfil.saldo) || 0;
                saldoPeserta[id] = saldoInt;
                const badge = document.getElementById(`badge-saldo-${id}`);
                badge.innerText = "Saldo Akhir: " + formatUang(saldoInt);
                badge.style.display = "inline-block";
              }

              if (resDetail && resDetail.success) {
                allDataBarang[id] = resDetail.data.map((b) => {
                  let statusFixVal = 1;
                  if (b.sumber === "FIX") {
                    let st = b.status_fix !== undefined ? b.status_fix : b.status;
                    statusFixVal = st == 1 || st === "1" ? 1 : 0;
                  } else if (b.status_fix !== undefined) {
                    statusFixVal = b.status_fix == 1 || b.status_fix === "1" ? 1 : 0;
                  }
                  let namaBrgClean = b.nama_barang ? b.nama_barang.trim().toLowerCase() : "";
                  let hrgSatuan = Number(b.harga_satuan);
                  
                  // Jika harga satuan tidak ada/Nol di database pesanan, ambil dari Master Barang
                  if (isNaN(hrgSatuan) || hrgSatuan === 0) {
                      let masterInfo = masterBarangGlobal[namaBrgClean];
                      if (masterInfo && masterInfo.hargaJual > 0) {
                          hrgSatuan = masterInfo.hargaJual;
                      } else {
                          hrgSatuan = 0; // Tetap 0 jika di master juga tidak ada
                      }
                  }
                  return { ...b, status_fix: statusFixVal };
                });
                document.getElementById("btnSimpan").style.display = "flex";
                document.getElementById("infoTotalBottom").style.display = "flex";
                renderBarangPeserta(id, pNama, pPaket);
              } else {
                allDataBarang[id] = [];
                document.getElementById(`list-barang-${id}`).innerHTML = `<div style="text-align:center; padding:15px; color:#ff4d4d; font-size:0.8rem; border: 1px dashed #444; border-radius:8px;">Tidak ada pesanan barang di Database.</div>`;
              }
            } catch (e) {
              alert("Gagal memuat rincian pesanan untuk peserta ini.");
            } finally {
              document.getElementById(`loading-${id}`).style.display = "none";
            }
          }
        }
      }

      function renderBarangPeserta(id, pNama, pPaket) {
        const boxList = document.getElementById(`list-barang-${id}`);
        const summaryBox = document.getElementById(`summary-box-${id}`);
        boxList.innerHTML = "";

        const items = allDataBarang[id];
        if (items.length === 0) return;

        let pNamaEscaped = pNama.replace(/'/g, "\\'");
        let pPaketEscaped = pPaket.replace(/'/g, "\\'");
        let isSudahFix = setSudahFixServer.has(id);

        let editButtonHtml = isSudahFix
          ? `<button class="btn-edit-mode" onclick="bukaModeEdit('${id}', '${pNamaEscaped}', '${pPaketEscaped}')"><i class="fas fa-edit"></i> Edit / Atur Ulang Pilihan</button>` : "";

        summaryBox.innerHTML = `
          <button class="btn-wa" onclick="bagikanWA('${id}', '${pNamaEscaped}', '${pPaketEscaped}')"><i class="fab fa-whatsapp"></i> Kirim Konfirmasi Fix (WA)</button>
          <button class="btn-select-all" onclick="togglePilihSemuaBarang('${id}', '${pNamaEscaped}', '${pPaketEscaped}')"><i class="fas fa-check-double"></i> Pilih / Batalkan Semua Barang</button>
          
          <div style="margin-top: 10px; margin-bottom: 10px; background: #111; padding: 10px; border-radius: 8px; border: 1px dashed #444;">
             <div style="font-size:0.75rem; color:#aaa; margin-bottom:6px;">Tambah Barang Manual (Auto Save):</div>
             <div style="display:flex; gap:6px;">
                <input type="text" id="input-add-brg-${id}" list="datalist-barang" class="filter-input-normal" style="flex:1; padding:6px; font-size:0.8rem;" placeholder="Ketik filter nama barang...">
                <input type="number" id="input-add-qty-${id}" class="filter-input-normal" style="width:50px; padding:6px; font-size:0.8rem; text-align:center;" value="1" min="1">
                <button onclick="tambahBarangSatuPeserta('${id}')" style="background:var(--success); color:#000; border:none; border-radius:6px; font-weight:bold; padding:0 12px; cursor:pointer;"><i class="fas fa-save"></i></button>
             </div>
          </div>

          <div class="summary-box">
            <div class="sum-row"><span>Saldo Akhir:</span> <b style="color:var(--primary);">${formatUang(saldoPeserta[id])}</b></div>
            <div class="sum-row"><span>Total Terpilih:</span> <b id="tot-pilih-${id}" style="color:var(--danger);">Rp 0</b></div>
            <div class="sum-row sisa"><span>Sisa Saldo:</span> <b id="sisa-saldo-${id}" style="color:var(--success);">${formatUang(saldoPeserta[id])}</b></div>
          </div>
        `;

        items.forEach((b, index) => {
          let isChecked = b.status_fix == 1 ? "checked" : "";
          let hrgSatuan = Number(b.harga_satuan) || 0;
          let subtotal = hrgSatuan * (Number(b.qty) || 0);
          b.total_harga = subtotal;

          boxList.innerHTML += `
            <div class="barang-card ${isChecked}" id="card-${id}-${index}">
              <div style="flex: 1; display:flex; justify-content:space-between; align-items:center; gap:10px; overflow:hidden;">
                <div style="overflow:hidden;">
                  <div style="color:#fff; font-weight:bold; font-size:0.85rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${b.nama_barang}</div>
                  <div style="font-size:0.75rem; color:#888;">Subtotal: <span id="subtotal-${id}-${index}" style="color:var(--primary); font-weight:bold;">${formatUang(subtotal)}</span></div>
                </div>
              </div>
              <div style="display:flex; align-items:center; gap:10px;">
                <input type="number" class="input-qty-custom" id="qty-${id}-${index}" value="${b.qty}" min="0" oninput="ubahQtyItem('${id}', ${index})">
                <div class="custom-checkbox" onclick="toggleCheckItem('${id}', ${index})"><i class="fas fa-check"></i></div>
              </div>
            </div>
          `;
        });

        updateUIPeserta(id);
        kalkulasiTotalGlobal();
      }

      function bukaModeEdit(id, pNama, pPaket) {
        if (confirm("Mulai edit pilihan barang untuk peserta ini? Anda dapat mengubah kuantitas atau mencentang ulang sesuai kebutuhan.")) {
          renderBarangPeserta(id, pNama, pPaket);
        }
      }

      function ubahQtyItem(id, index) {
        let item = allDataBarang[id][index];
        let inputEl = document.getElementById(`qty-${id}-${index}`);
        let newQty = parseInt(inputEl.value);
        if (isNaN(newQty) || newQty < 0) newQty = 0;

        let hrgSatuan = Number(item.harga_satuan) || 0;
        let oldTotal = item.total_harga;

        let potentialTotal = hitungTotalPeserta(id) - (item.status_fix == 1 ? oldTotal : 0) + (item.status_fix == 1 ? hrgSatuan * newQty : 0);
        let saldoAkhir = saldoPeserta[id] || 0;

        if (item.status_fix == 1 && potentialTotal > saldoAkhir) {
          alert(`⚠️ PERINGATAN SALDO MINUS!\nTotal tagihan melebihi Sisa Saldo. Kuantitas barang tetap diubah (Kasbon).`);
        }

        item.qty = newQty;
        item.total_harga = hrgSatuan * newQty;
        document.getElementById(`subtotal-${id}-${index}`).innerText = formatUang(item.total_harga);

        updateUIPeserta(id);
        kalkulasiTotalGlobal();
        perbaruiBadgeStatusPeserta(id);
      }

      function toggleCheckItem(id, index) {
        let item = allDataBarang[id][index];
        let card = document.getElementById(`card-${id}-${index}`);
        let isCurrentlyChecked = card.classList.contains("checked");
        let currentTotal = hitungTotalPeserta(id);
        let saldoAkhir = saldoPeserta[id] || 0;
        let hargaItem = parseFloat(item.total_harga) || 0;

        if (!isCurrentlyChecked) {
          if (currentTotal + hargaItem > saldoAkhir) {
            let sisa = saldoAkhir - currentTotal;
            alert(`⚠️ PERINGATAN SALDO MINUS!\n\nHarga barang (${formatUang(hargaItem)}) melebihi Sisa Saldo Anda yang hanya ${formatUang(sisa)}.\n\nBarang tetap ditambahkan ke dalam daftar (Kasbon).`);
          }
          item.status_fix = 1;
          card.classList.add("checked");
        } else {
          item.status_fix = 0;
          card.classList.remove("checked");
        }
        updateUIPeserta(id);
        kalkulasiTotalGlobal();
        perbaruiBadgeStatusPeserta(id);
      }

      function togglePilihSemuaBarang(id, pNama, pPaket) {
        let items = allDataBarang[id];
        if (!items || items.length === 0) return;
        let semuaTercentang = items.every((b) => b.status_fix == 1 && b.qty > 0);
        let saldoAkhir = saldoPeserta[id] || 0;

        if (!semuaTercentang) {
          let totalSemua = items.reduce((sum, b) => sum + (parseFloat(b.total_harga) || 0), 0);
          if (totalSemua > saldoAkhir) {
            alert(`⚠️ PERINGATAN SALDO MINUS!\nTotal seluruh barang (${formatUang(totalSemua)}) melebihi saldo peserta (${formatUang(saldoAkhir)}).\n\nSemua barang tetap dipilih (Kasbon).`);
          }
          items.forEach((b) => { if (b.qty > 0) b.status_fix = 1; });
        } else {
          items.forEach((b) => (b.status_fix = 0));
        }
        renderBarangPeserta(id, pNama, pPaket);
        perbaruiBadgeStatusPeserta(id);
      }

      function perbaruiBadgeStatusPeserta(id) {
        const wrapBadge = document.getElementById(`badge-status-wrap-${id}`);
        if (!wrapBadge) return;
        let isSudahDipilih = allDataBarang[id].some((b) => b.status_fix == 1 && b.qty > 0);
        if (isSudahDipilih) {
          setSudahFixServer.add(id);
          wrapBadge.outerHTML = `<span class="badge-status-pilih badge-sudah" id="badge-status-wrap-${id}"><i class="fas fa-check-circle"></i> Sudah Dipilih</span>`;
        } else {
          setSudahFixServer.delete(id);
          wrapBadge.outerHTML = `<span class="badge-status-pilih badge-belum" id="badge-status-wrap-${id}"><i class="fas fa-clock"></i> Belum Dipilih</span>`;
        }
      }

      function hitungTotalPeserta(id) {
        let total = 0;
        if (allDataBarang[id]) {
          allDataBarang[id].forEach((b) => { if (b.status_fix == 1) total += parseFloat(b.total_harga) || 0; });
        }
        return total;
      }

      function updateUIPeserta(id) {
        let totalPilih = hitungTotalPeserta(id);
        let saldoAwal = saldoPeserta[id] || 0;
        let sisa = saldoAwal - totalPilih;

        document.getElementById(`tot-pilih-${id}`).innerText = formatUang(totalPilih);
        const elSisa = document.getElementById(`sisa-saldo-${id}`);
        elSisa.innerText = formatUang(sisa);

        if (sisa < 0) elSisa.style.color = "var(--danger)";
        else if (sisa === 0) elSisa.style.color = "#888";
        else elSisa.style.color = "var(--success)";

        let totalPesananPeserta = 0;
        if (allDataBarang[id]) {
          allDataBarang[id].forEach((b) => { totalPesananPeserta += parseFloat(b.total_harga) || 0; });
        }

        let badgeTotalBrg = document.getElementById(`badge-total-barang-${id}`);
        if (badgeTotalBrg) {
          if (totalPesananPeserta > 0) {
            badgeTotalBrg.innerText = "Tot. Pesanan: " + formatUang(totalPesananPeserta);
            badgeTotalBrg.style.display = "inline-block";
          } else {
            badgeTotalBrg.style.display = "none";
          }
        }
      }

      function bagikanWA(id, nama, paket) {
        let itemsFix = allDataBarang[id].filter((b) => b.status_fix == 1 && b.qty > 0);
        if (itemsFix.length === 0) return alert("Belum ada barang yang dicentang (Fix)!");
        let totalPilih = hitungTotalPeserta(id);
        let saldoAwal = saldoPeserta[id] || 0;
        let sisa = saldoAwal - totalPilih;

        let text = `📦 *KONFIRMASI REKAP BARANG NIZAMI*\n\n👤 *Nama:* ${nama}\n💳 *Paket:* ${paket}\n💰 *Saldo Akhir:* ${formatUang(saldoAwal)}\n\n*Rincian Barang Fix (Sanggup Terbeli):*\n`;
        itemsFix.forEach((b) => { text += `▪️ ${b.qty}x ${b.nama_barang} (${formatUang(b.total_harga)})\n`; });
        text += `\n---------------------------\n*Total Nilai Barang:* ${formatUang(totalPilih)}\n*Sisa Saldo:* ${formatUang(sisa)}\n\n_Mohon dicek kembali, terima kasih._ 🙏`;
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, "_blank");
      }

      function kalkulasiTotalGlobal() {
        let total = 0;
        for (let id in allDataBarang) total += hitungTotalPeserta(id);
        document.getElementById("lblTotalHarga").innerText = formatUang(total);
      }

      async function simpanChecklistGlobal() {
        const keys = Object.keys(allDataBarang);
        if (keys.length === 0) return alert("Belum ada data peserta yang dibuka.");
        const btn = document.getElementById("btnSimpan");
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> MENYIMPAN...';
        btn.disabled = true;

        let successCount = 0;
        try {
          for (let i = 0; i < keys.length; i++) {
            let idPeserta = keys[i];
            let pesertaInfo = dataPesertaManual.find((p) => p.id === idPeserta) || {};
            let itemsPeserta = allDataBarang[idPeserta].map((b) => ({
              ...b, status_fix: b.status_fix == 1 ? 1 : 0, status: b.status_fix == 1 ? 1 : 0,
            }));

            const res = await fetchData("simpanRekapManual", {
                id_peserta: idPeserta, nama_peserta: pesertaInfo.nama || "",
                jenis_paket: pesertaInfo.paket || "", mitra: pesertaInfo.mitra || "ADMIN", items: itemsPeserta,
            }, "POST");

            if (res && res.success) {
              successCount++;
              setSudahFixServer.add(idPeserta);
              perbaruiBadgeStatusPeserta(idPeserta);
            }
          }
          if (successCount > 0) {
            alert("✅ Data checklist rekap manual berhasil disimpan ke FIX_BARANG!");
          } else { alert("⚠️ Gagal menyimpan ke server."); }
        } catch (e) { alert("⚠️ Terjadi kesalahan jaringan.");
        } finally { btn.innerHTML = '<i class="fas fa-save"></i> SIMPAN CHECKLIST'; btn.disabled = false; }
      }

      /* AKSI CHECKLIST MASSAL OTOMATIS (AUTO SAVE) */
      async function terapkanChecklistMassal(event) {
        const filterBrgText = document.getElementById("filterOrderanBarang").value.trim().toLowerCase();
        if (!filterBrgText) return alert("Silakan ketik nama barang pada kolom filter terlebih dahulu.");
        if (!currentFilteredPeserta || currentFilteredPeserta.length === 0) return alert("Tidak ada peserta yang tampil untuk dichecklist.");
        
        let uniqueFiltered = [];
        let seenIds = new Set();
        for (let p of currentFilteredPeserta) {
            if (!seenIds.has(p.id)) {
                seenIds.add(p.id);
                uniqueFiltered.push(p);
            }
        }
        
        if (!confirm(`Tindakan ini akan OTOMATIS MENCENTANG (Checklist) pesanan barang yang mengandung kata "${filterBrgText}" untuk ${uniqueFiltered.length} peserta yang tampil.\n\nData akan langsung disimpan ke database (FIX_BARANG). Lanjutkan?`)) return;

        const btn = event.currentTarget;
        let originalText = btn.innerHTML;
        btn.disabled = true;

        let countChecked = 0;
        let total = uniqueFiltered.length;

        for (let i = 0; i < total; i++) {
          let p = uniqueFiltered[i];
          let id = p.id;
          btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Memproses ${i+1} dari ${total}...`;

          // Tarik rincian dari database jika panel rincian peserta belum pernah dibuka oleh admin di sesi ini
          if (!allDataBarang[id]) {
            try {
              const [resDetail, resProfil] = await Promise.all([
                fetchData("getDetailPesananPeserta", { id_peserta: id }, "POST"),
                fetchData("getDetailAdmin", { id: id }),
              ]);
              if (resProfil && !resProfil.error) saldoPeserta[id] = Number(resProfil.saldo) || 0;
              if (resDetail && resDetail.success) {
                allDataBarang[id] = resDetail.data.map((b) => {
                  let st = b.sumber === "FIX" ? (b.status_fix !== undefined ? b.status_fix : b.status) : (b.status_fix !== undefined ? b.status_fix : 0);
                  return { ...b, status_fix: st == 1 || st === "1" ? 1 : 0 };
                });
              } else { allDataBarang[id] = []; }
            } catch (e) { allDataBarang[id] = []; }
          }

          let isModified = false;
          
          // Cari barang yang namanya cocok dengan filter, lalu ubah status_fix nya jadi 1 (Tercentang)
          allDataBarang[id].forEach(b => {
             if (b.nama_barang.toLowerCase().includes(filterBrgText)) {
                 if (b.status_fix != 1 && b.qty > 0) { // Hanya centang jika belum dicentang & qty > 0
                     b.status_fix = 1;
                     isModified = true;
                 }
             }
          });

          // Jika ada perubahan (ada barang yang baru saja dichecklist), simpan langsung ke database
          if (isModified) {
              let itemsPeserta = allDataBarang[id].map((b) => ({
                  ...b, status_fix: b.status_fix == 1 ? 1 : 0, status: b.status_fix == 1 ? 1 : 0,
              }));

              try {
                  await fetchData("simpanRekapManual", {
                      id_peserta: id, nama_peserta: p.nama || "", jenis_paket: p.paket || "",
                      mitra: p.mitra || "ADMIN", items: itemsPeserta,
                  }, "POST");
                  setSudahFixServer.add(id);
                  countChecked++;
              } catch (e) { console.error("Gagal simpan ke DB", id); }
          }
          
          // Perbarui UI jika kebetulan kotak rincian sedang terbuka
          let box = document.getElementById(`list-barang-${id}`);
          if (box && box.innerHTML !== "") renderBarangPeserta(id, p.nama, p.paket);
          perbaruiBadgeStatusPeserta(id);
        }

        btn.innerHTML = originalText;
        btn.disabled = false;
        kalkulasiTotalGlobal();
        document.getElementById("filterOrderanBarang").value = "";
        terapkanFilter(); // Refresh UI untuk menyembunyikan kotak massal kembali
        
        alert(`✅ Selesai! Terdapat ${countChecked} peserta yang pesanannya baru saja berhasil dichecklist otomatis dan disimpan.`);
      }

      /* AKSI SATUAN AUTO SAVE */
      async function tambahBarangSatuPeserta(id) {
        let inputBrg = document.getElementById(`input-add-brg-${id}`).value.trim();
        let inputQty = parseInt(document.getElementById(`input-add-qty-${id}`).value);

        if (!inputBrg || isNaN(inputQty) || inputQty <= 0) return alert("Input barang dan Qty tidak valid.");

        let key = inputBrg.toLowerCase();
        let info = masterBarangGlobal[key];
        let hargaSatuan = info ? info.hargaJual : 0;
        let namaAsli = info ? info.namaAsli : inputBrg;

        let existingIndex = allDataBarang[id].findIndex(b => b.nama_barang.toLowerCase() === key);
        if (existingIndex !== -1) {
          allDataBarang[id][existingIndex].qty = inputQty; // OVERWRITE qty, hindari data dobel
          allDataBarang[id][existingIndex].total_harga = inputQty * allDataBarang[id][existingIndex].harga_satuan;
          allDataBarang[id][existingIndex].status_fix = 1;
        } else {
          allDataBarang[id].push({
            nama_barang: namaAsli, qty: inputQty, harga_satuan: hargaSatuan,
            total_harga: hargaSatuan * inputQty, status_fix: 1, sumber: "MANUAL"
          });
        }
        
        let pInfo = dataPesertaManual.find(p => p.id === id);
        renderBarangPeserta(id, pInfo.nama, pInfo.paket);

        let btnIcon = document.querySelector(`#input-add-brg-${id}`).nextElementSibling.nextElementSibling;
        let origHtml = btnIcon.innerHTML;
        btnIcon.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
        btnIcon.disabled = true;

        let itemsPeserta = allDataBarang[id].map((b) => ({
            ...b, status_fix: b.status_fix == 1 ? 1 : 0, status: b.status_fix == 1 ? 1 : 0,
        }));

        try {
            await fetchData("simpanRekapManual", {
                id_peserta: id, nama_peserta: pInfo.nama || "", jenis_paket: pInfo.paket || "",
                mitra: pInfo.mitra || "ADMIN", items: itemsPeserta,
            }, "POST");
            setSudahFixServer.add(id);
            perbaruiBadgeStatusPeserta(id);
        } catch (e) {
            alert("Gagal otomatis menyimpan ke server.");
        }
        
        btnIcon.innerHTML = origHtml;
        btnIcon.disabled = false;
        document.getElementById(`input-add-brg-${id}`).value = "";
      }

      /* =======================================================
         MODAL BELANJA & TAB SWITCHING
         ======================================================= */
      function switchModalTab(tabName) {
        const btnBelanja = document.getElementById("tabBtnBelanja");
        const btnSudahBeli = document.getElementById("tabBtnSudahBeli");
        const contentBelanja = document.getElementById("contentTabBelanja");
        const contentSudahBeli = document.getElementById("contentTabSudahBeli");

        if (tabName === "belanja") {
          if (btnBelanja) btnBelanja.classList.add("active");
          if (btnSudahBeli) btnSudahBeli.classList.remove("active");
          if (contentBelanja) contentBelanja.style.display = "flex";
          if (contentSudahBeli) contentSudahBeli.style.display = "none";
        } else {
          if (btnSudahBeli) btnSudahBeli.classList.add("active");
          if (btnBelanja) btnBelanja.classList.remove("active");
          if (contentSudahBeli) contentSudahBeli.style.display = "flex";
          if (contentSudahBeli) contentSudahBeli.style.display = "none";
          loadRiwayatGudang();
        }
      }

      async function bukaModalBelanja() {
        const modal = document.getElementById("modalBelanja");
        if (!modal) return;
        modal.style.display = "flex";
        switchModalTab("belanja");
        const container = document.getElementById("listBelanjaContainer");
        if (container) container.innerHTML = `<div style="text-align:center; color:var(--primary); padding:30px;"><i class="fas fa-spinner fa-spin"></i> Memuat daftar belanja...</div>`;
        try {
          const res = await fetchData("getBelanjaFix");
          if (res && res.success) {
            dataBelanjaGlobal = res.data;
            setupKategoriDropdown();
            renderBelanjaList();
          } else { alert("Gagal menarik data dari server."); }
        } catch (e) { alert("Terjadi kesalahan jaringan saat memuat rekap belanja."); }
      }

      function setupKategoriDropdown() {
        const selectKategori = document.getElementById("filterKategoriBarang");
        const selectRiwayat = document.getElementById("filterKategoriRiwayat");
        let kategoriSet = new Set();
        dataBelanjaGlobal.forEach((b) => {
          let key = b.barang.trim().toLowerCase();
          let kat = masterBarangGlobal[key] ? masterBarangGlobal[key].kategori : "Lainnya";
          kategoriSet.add(kat);
        });
        let optHtml = `<option value="ALL">📂 Semua Kategori</option>`;
        Array.from(kategoriSet).sort().forEach((kat) => { optHtml += `<option value="${kat}">${kat}</option>`; });
        selectKategori.innerHTML = optHtml; selectRiwayat.innerHTML = optHtml;
      }

      function renderBelanjaList() {
        const container = document.getElementById("listBelanjaContainer");
        const hanyaKurang = document.getElementById("chkHanyaKurang").checked;
        const keyword = document.getElementById("cariBarangBelanja").value.toLowerCase();
        const selectedKategori = document.getElementById("filterKategoriBarang").value;
        container.innerHTML = "";

        let tampil = dataBelanjaGlobal.filter((b) => {
          let key = b.barang.trim().toLowerCase();
          let info = masterBarangGlobal[key] || { kategori: "Lainnya", satuan: "pcs", hargaBeli: 0, hargaJual: 0 };
          let matchKurang = hanyaKurang ? b.kurang > 0 : true;
          let matchKeyword = keyword === "" || b.barang.toLowerCase().includes(keyword);
          let matchKategori = selectedKategori === "ALL" || info.kategori === selectedKategori;
          return matchKurang && matchKeyword && matchKategori;
        });

        if (tampil.length === 0) {
          container.innerHTML = `<div style="text-align:center; color:#888; padding:30px; border:1px dashed #333; border-radius:10px; margin-top:10px;">🎉 Tidak ada barang yang sesuai kriteria!</div>`;
          return;
        }

        tampil.forEach((b) => {
          let key = b.barang.trim().toLowerCase();
          let info = masterBarangGlobal[key] || { kategori: "Lainnya", satuan: "pcs", hargaBeli: 0, hargaJual: 0 };
          let isAman = b.kurang === 0;

          container.innerHTML += `
            <div class="belanja-card-item ${isAman ? "aman" : "kurang"}">
              <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px;">
                <div style="flex: 1; overflow: hidden; padding-right: 8px;">
                  <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
                    <span style="font-size: 0.6rem; background: #222; color: var(--primary); padding: 1px 5px; border-radius: 3px; border: 1px solid #444; font-weight: bold;">${info.kategori}</span>
                    <b style="color: #fff; font-size: 0.9rem;">${b.barang}</b>
                    <span style="font-size: 0.72rem; color: #aaa;">/ <b>${info.satuan}</b> / <span style="color:var(--primary);">${formatUang(info.hargaBeli)}</span> / <span>${formatUang(info.hargaJual)}</span></span>
                  </div>
                </div>
                <span style="font-size: 0.7rem; padding: 2px 7px; border-radius: 5px; font-weight: bold; background: ${isAman ? "rgba(74,222,128,0.15)" : "rgba(255,77,77,0.15)"}; color: ${isAman ? "var(--success)" : "var(--danger)"}; border: 1px solid ${isAman ? "rgba(74,222,128,0.3)" : "rgba(255,77,77,0.3)"}; white-space: nowrap;">
                  ${isAman ? "AMAN" : "KURANG " + b.kurang}
                </span>
              </div>
              <div style="display: flex; justify-content: space-between; align-items: center; background: #111; border-radius: 6px; padding: 6px 10px; font-size: 0.75rem; border: 1px solid #2a2a2a;">
                <span style="color: #bbb;">Target: <b style="color:#fff;">${b.butuh}</b> | Stok: <b style="color:var(--success);">${b.masuk}</b> | Kurang: <b style="color:${isAman ? "var(--success)" : "var(--danger)"};">${b.kurang}</b></span>
                <div style="display: flex; align-items: center; gap: 5px;">
                  <span style="font-size: 0.7rem; color: var(--primary); font-weight: bold;">+ Masuk:</span>
                  <input type="number" class="input-beli-stok" data-nama="${b.barang}" placeholder="0" min="0" style="width: 55px; background: #000; border: 1px solid var(--primary); color: #fff; padding: 4px; border-radius: 5px; text-align: center; font-weight: bold; font-size: 0.8rem;">
                </div>
              </div>
            </div>
          `;
        });
      }

      let dataRiwayatGudangGlobal = [];
      async function loadRiwayatGudang() {
        const container = document.getElementById("listRiwayatGudangContainer");
        container.innerHTML = `<div style="text-align:center; padding:30px; color:var(--primary);"><i class="fas fa-spinner fa-spin"></i> Memuat riwayat gudang...</div>`;
        try {
          const res = await fetchData("getRekapBelanja");
          if (res && res.stok_dibeli) {
            dataRiwayatGudangGlobal = [];
            for (let namaBrg in res.stok_dibeli) {
              let qtyMasuk = res.stok_dibeli[namaBrg] || 0;
              let key = namaBrg.trim().toLowerCase();
              let info = masterBarangGlobal[key] || { kategori: "Lainnya", satuan: "pcs", hargaBeli: 0 };
              dataRiwayatGudangGlobal.push({ barang: namaBrg, qty: qtyMasuk, satuan: info.satuan, kategori: info.kategori, hargaBeli: info.hargaBeli });
            }
            renderRiwayatGudangList();
          } else { container.innerHTML = `<div style="text-align:center; color:#888; padding:30px;">Belum ada riwayat barang di REKAP_BELANJA.</div>`; }
        } catch (e) { container.innerHTML = `<div style="text-align:center; color:#ff4d4d; padding:30px;">Gagal memuat data gudang.</div>`; }
      }

      function renderRiwayatGudangList() {
        const container = document.getElementById("listRiwayatGudangContainer");
        const keyword = document.getElementById("cariRiwayatGudang").value.toLowerCase();
        const selectedKat = document.getElementById("filterKategoriRiwayat").value;
        container.innerHTML = "";

        let hasil = dataRiwayatGudangGlobal.filter((item) => {
          let matchKey = keyword === "" || item.barang.toLowerCase().includes(keyword);
          let matchKat = selectedKat === "ALL" || item.kategori === selectedKat;
          return matchKey && matchKat;
        });

        if (hasil.length === 0) {
          container.innerHTML = `<div style="text-align:center; color:#888; padding:30px; border:1px dashed #333; border-radius:10px;">Tidak ada riwayat barang yang cocok.</div>`;
          return;
        }

        hasil.forEach((item) => {
          container.innerHTML += `
            <div class="belanja-card-item aman" style="margin-bottom: 6px; padding: 8px 12px;">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                  <span style="font-size: 0.6rem; background: #222; color: var(--primary); padding: 1px 5px; border-radius: 3px; border: 1px solid #444; font-weight: bold;">${item.kategori}</span>
                  <div style="color: #fff; font-weight: bold; font-size: 0.85rem; margin-top: 2px;">${item.barang}</div>
                </div>
                <div style="text-align: right;"><span style="font-size: 0.8rem; font-weight: bold; color: var(--success); background: rgba(74,222,128,0.1); padding: 3px 8px; border-radius: 5px; border: 1px solid rgba(74,222,128,0.3);">${item.qty} ${item.satuan}</span></div>
              </div>
            </div>
          `;
        });
      }

      async function simpanStokBelanja() {
        let itemsToSave = [];
        document.querySelectorAll(".input-beli-stok").forEach((inp) => {
          let val = parseInt(inp.value);
          let namaBrg = inp.getAttribute("data-nama");
          let key = namaBrg.trim().toLowerCase();
          let info = masterBarangGlobal[key] || { satuan: "pcs" };
          if (val > 0) itemsToSave.push({ nama: namaBrg, qty: val, satuan: info.satuan });
        });

        if (itemsToSave.length === 0) return alert("Belum ada input angka barang yang dibeli (ditambahkan).");
        const btn = document.getElementById("btnSimpanBelanja");
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> MENYIMPAN...';
        btn.disabled = true;

        try {
          const res = await fetchData("simpanBelanja", { items: itemsToSave }, "POST");
          if (res && res.success) { alert("✅ Data belanja berhasil ditambahkan ke REKAP_BELANJA (Gudang)!"); bukaModalBelanja(); } 
          else { alert("⚠️ Gagal menyimpan data belanja."); }
        } catch (e) { alert("⚠️ Terjadi kesalahan jaringan."); } 
        finally { btn.innerHTML = '<i class="fas fa-save"></i> SIMPAN BARANG MASUK KE GUDANG'; btn.disabled = false; }
      }

      function confirmExit() {
        if (Object.keys(allDataBarang).length > 0) {
          return confirm("Kembali ke menu utama?");
        }
        return true;
      }

      function bukaModalFormTambahBelanja() {
        let namaBarangInput = prompt("Masukkan Nama Barang yang ingin ditambahkan ke rekap belanja:");
        if (!namaBarangInput || !namaBarangInput.trim()) return;
        let qtyInput = prompt("Masukkan Jumlah (Qty) yang dibeli:", "1");
        let qtyNum = parseInt(qtyInput);
        if (isNaN(qtyNum) || qtyNum <= 0) { return alert("Jumlah/Qty harus berupa angka lebih dari 0!"); }
        let satuanInput = prompt("Masukkan Satuan barang (contoh: Pcs, Pack, Dus):", "Pcs") || "pcs";
        simpanBelanjaManualCustom(namaBarangInput.trim(), qtyNum, satuanInput.trim());
      }

      async function simpanBelanjaManualCustom(nama, qty, satuan) {
        try {
          const res = await fetchData("simpanBelanja", { items: [{ nama: nama, qty: qty, satuan: satuan }] }, "POST");
          if (res && res.success) { alert("✅ Berhasil menambahkan belanjaan baru!"); loadRiwayatGudang(); } 
          else { alert("⚠️ Gagal menyimpan data belanja."); }
        } catch (e) { alert("⚠️ Terjadi kesalahan jaringan."); }
      }

      window.onload = initData;
    </script>
  </body>
</html>
